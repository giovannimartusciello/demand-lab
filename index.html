<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Laboratorio didattico di previsione della domanda e pianificazione delle scorte. Dati simulati, caso Decathlon." />
  <title>Demand Lab · Domanda e scorte</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.2/build/stlite.css" />
  <style>body{margin:0;background:#f6f8fb;font-family:system-ui,sans-serif;color:#17324d}#boot{max-width:680px;margin:10vh auto;padding:32px}#boot h1{font-size:32px}#boot p{line-height:1.7}#boot small{color:#526778}</style>
</head>
<body>
  <div id="boot" role="status"><small>PROJECT WORK · INFORMATICA PER LE AZIENDE DIGITALI</small><h1>Domanda e scorte, nel browser.</h1><p>Caricamento del laboratorio Python. Al primo accesso il download può richiedere alcuni minuti, in base alla connessione.</p><p>Dati simulati per un caso didattico ispirato a Decathlon.</p><noscript>Abilita JavaScript per utilizzare il laboratorio.</noscript></div>
  <main id="root"></main>
  <script type="module">
    const boot = document.getElementById("boot");
    try {
      const { mount } = await import("https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.2/build/stlite.js");
      const paths = ["app.py", "models.py", "locale_it.py", "data/demand.csv", "data/catalog.json"];
      const files = Object.fromEntries(await Promise.all(paths.map(async (path) => {
        const response = await fetch(new URL(path, document.baseURI));
        if (!response.ok) throw new Error(`Cannot load ${path}: ${response.status}`);
        return [path, await response.text()];
      })));
      mount({
        entrypoint: "app.py", files,
        requirements: ["pandas", "altair==6.3.0"],
        streamlitConfig: {
          "theme.base": "light", "theme.primaryColor": "#006d77",
          "theme.backgroundColor": "#f6f8fb", "theme.secondaryBackgroundColor": "#ffffff",
          "theme.textColor": "#17324d", "client.toolbarMode": "viewer"
        }
      }, document.getElementById("root"));
      boot.remove();
    } catch (error) {
      boot.innerHTML = '<h1>Il laboratorio non è stato caricato</h1><p>Controlla la connessione e ricarica la pagina. Apri il sito tramite il suo indirizzo web, non facendo doppio clic sul file HTML.</p>';
      console.error(error);
    }
  </script>
</body>
</html>
